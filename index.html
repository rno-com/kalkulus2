<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luas Daerah Interaktif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Serif+4:ital,wght@0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  svg: { fontCache: 'global' },
  options: { enableMenu: false },
  startup: {
    typeset: false,
    ready() {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(function () { window.__mjReady = true; if (window.__onMJ) window.__onMJ(); });
    }
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg-full.js" async></script>
<style>
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#EAF1EF; --surface-3:#F7FAF9;
  --ink:#10201C; --ink-2:#40524D; --ink-3:#6A7B77; --line:#D3DDDA; --line-2:#E4EBE9;
  --accent:#2F7D6E; --accent-2:#5FA396; --accent-soft:#DCEEE9; --accent-ink:#1D5A4F;
  --c1:#2563EB; --c2:#DB2777; --cn:#374151;
  --area:#F59E0B; --area-op:.26; --reg2:#06B6D4; --reg2-op:.30; --regG:#9CA3AF; --regG-op:.38;
  --slice:#0F766E; --slice-op:.30; --pt:#111827;
  --ok:#15803D; --ok-bg:#E7F5EC; --bad:#B91C1C; --bad-bg:#FBEBEB; --info:#1D4ED8; --info-bg:#EAF0FD;
  --warn:#8A4B06; --warn-bg:#FDF3DC;
  --font:'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif;
  --serif:'Source Serif 4',Cambria,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1412; --surface:#131C1A; --surface-2:#1A2724; --surface-3:#16211F;
    --ink:#E4EDEA; --ink-2:#B1C1BC; --ink-3:#879894; --line:#2A3834; --line-2:#22302C;
    --accent:#5FB3A2; --accent-2:#5FA396; --accent-soft:#1B342E; --accent-ink:#8FD6C6;
    --c1:#6FA8FF; --c2:#F472B6; --cn:#CBD5E1;
    --area:#FBBF24; --area-op:.24; --reg2:#22D3EE; --reg2-op:.26; --regG:#94A3B8; --regG-op:.30;
    --slice:#2DD4BF; --slice-op:.28; --pt:#F3F4F6;
    --ok:#4ADE80; --ok-bg:#11261A; --bad:#F87171; --bad-bg:#2B1515; --info:#93B4FF; --info-bg:#172036;
    --warn:#FCD34D; --warn-bg:#2A2210;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1412; --surface:#131C1A; --surface-2:#1A2724; --surface-3:#16211F;
  --ink:#E4EDEA; --ink-2:#B1C1BC; --ink-3:#879894; --line:#2A3834; --line-2:#22302C;
  --accent:#5FB3A2; --accent-2:#5FA396; --accent-soft:#1B342E; --accent-ink:#8FD6C6;
  --c1:#6FA8FF; --c2:#F472B6; --cn:#CBD5E1;
  --area:#FBBF24; --area-op:.24; --reg2:#22D3EE; --reg2-op:.26; --regG:#94A3B8; --regG-op:.30;
  --slice:#2DD4BF; --slice-op:.28; --pt:#F3F4F6;
  --ok:#4ADE80; --ok-bg:#11261A; --bad:#F87171; --bad-bg:#2B1515; --info:#93B4FF; --info-bg:#172036;
  --warn:#FCD34D; --warn-bg:#2A2210;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-weight:700;font-size:15px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:4px;background:var(--line-2)}
.progress i{display:block;height:100%;width:0;background:var(--accent-2);transition:width .35s ease}
main{flex:1;overflow:auto;overflow-x:hidden;scroll-behavior:smooth}
.navbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.counter{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--ink-2);text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.counter small{font-family:var(--font);letter-spacing:0;color:var(--ink-3);font-size:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;letter-spacing:.02em;cursor:pointer;transition:background .15s,border-color .15s,color .15s;min-height:38px}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0D1412}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0D1412}}
.btn.sm{padding:5px 10px;font-size:12.5px;min-height:32px;letter-spacing:.04em}
.btn.ghost{border-color:transparent;background:transparent}
.btn.nav{min-width:118px;font-family:var(--mono);font-size:13px;letter-spacing:.06em}

/* ---------- slide ---------- */
.slide{max-width:1320px;margin:0 auto;padding-block:22px 40px;padding-inline:24px;animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.s-head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;max-width:900px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.18}
h2{font-size:clamp(24px,2.6vw,32px);font-weight:700;letter-spacing:-.01em}
h3{font-size:17px;font-weight:700}
.lead{color:var(--ink-2);font-size:17px;margin:0;max-width:72ch}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:26px;align-items:start}
.grid.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:920px){.grid,.grid.even{grid-template-columns:minmax(0,1fr)}}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 6px;position:sticky;top:12px}
@media (max-width:920px){.fig{position:static}}
.fig-bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:2px 6px 6px;font-size:13px;color:var(--ink-2)}
.fig-cap{font-size:13.5px;color:var(--ink-3);padding:4px 8px 6px;margin:0}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.block{display:flex;flex-direction:column;gap:8px}
.block > p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:14px}
p{margin:0}
.src{font-size:15.5px;color:var(--ink-2);border-left:2px solid var(--line);padding-left:12px}

.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:4px;border:1px solid currentColor;line-height:1.2;white-space:nowrap}
.badge.pdf{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}
.badge.extra{color:var(--info);background:var(--info-bg);border-color:transparent}
.badge.fix{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.badge.cmp{color:var(--ink-2);background:var(--surface-2);border-color:transparent}

.plate{background:var(--surface-2);border-radius:var(--r);padding:14px 16px;overflow-x:auto;font-size:18px}
.plate.big{font-size:21px}
.plate .lbl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.formula{font-size:19px;overflow-x:auto;overflow-y:hidden;padding:2px 0}
mjx-container{max-width:100%}
.note,.fb,.hint,.q,.plate,.block{min-width:0;overflow-wrap:anywhere}
.note,.fb,.hint{overflow-x:auto}
mjx-container[display="true"]{margin:.4em 0 !important;overflow-x:auto;overflow-y:hidden}

/* readouts */
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.readout div{padding:8px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:inset -1px -1px 0 var(--line-2)}
.readout span{font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;color:var(--ink-3)}
.readout b{font-variant-numeric:tabular-nums;font-size:18px;font-weight:600}
.k1{color:var(--c1)} .k2{color:var(--c2)} .kA{color:var(--area)} .kS{color:var(--slice)} .kR{color:var(--reg2)}

/* controls */
.slider{display:flex;flex-direction:column;gap:4px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--ink-2)}
.slider-top output{font-family:var(--mono);font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;background:var(--surface-3)}
.seg-b{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink-2);min-height:36px}
.seg-b[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:0 0 0 1px var(--accent) inset}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);width:16px;height:16px}
select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);min-height:38px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* questions */
.q{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface)}
.q-text{font-weight:600;font-size:16.5px}
.q-tag{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.opts{display:flex;flex-direction:column;gap:7px}
.opts.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-3);cursor:pointer;font-size:15.5px;min-height:44px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt-k{font-family:var(--mono);font-weight:600;font-size:12px;width:24px;height:24px;border-radius:6px;display:inline-grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.opt.is-right{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-right .opt-k{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-wrong .opt-k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.fb{border-radius:8px;padding:10px 12px;font-size:15px}
.fb strong{font-family:var(--mono);font-size:12.5px;letter-spacing:.07em;margin-right:4px}
.fb.ok{background:var(--ok-bg);color:var(--ink)} .fb.ok strong{color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--ink)} .fb.bad strong{color:var(--bad)}
.fb.info{background:var(--info-bg);color:var(--ink)} .fb.info strong{color:var(--info)}
.q-tools{display:flex;flex-wrap:wrap;gap:6px}
.hint{background:var(--warn-bg);border-radius:8px;padding:10px 12px;font-size:15px}
.hint strong{color:var(--warn)}
.num-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.num-row input{width:130px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface-3);font-family:var(--mono);font-size:15px;min-height:40px}
.num-row input.ok{border-color:var(--ok)} .num-row input.bad{border-color:var(--bad)}

/* stepper */
.stepper{display:flex;flex-direction:column;gap:10px}
.step-btns{display:flex;flex-wrap:wrap;gap:6px}
.step-btn .n{font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.step-btn.done{border-color:var(--accent);color:var(--accent-ink)}
.step-btn.done .n{background:var(--accent);color:var(--surface)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.step{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--surface-3);border:1px solid var(--line-2);animation:fadeIn .3s ease}
.step::before{content:counter(st);font-family:var(--mono);font-size:12px;font-weight:600;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);margin-top:2px}
.step > div{min-width:0;overflow-x:auto;font-size:16.5px}
.step mjx-container[display="true"]{font-size:94%}
.step .st-h{font-weight:700;font-size:14px;color:var(--ink-2);margin-bottom:2px;display:block}

/* flows */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;list-style:none;margin:0;padding:0}
.flow li{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.flow li + li::before{content:"→";margin-right:8px;color:var(--ink-3)}
.flow li.on{background:var(--accent-soft);color:var(--accent-ink)}
.vflow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.vflow li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:6px 0;position:relative;font-size:15.5px}
.vflow li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);margin:6px 0 0 5px;z-index:1}
.vflow li:not(:last-child)::after{content:"";position:absolute;left:10px;top:20px;bottom:-8px;width:2px;background:var(--line)}
.vflow li.on::before{background:var(--accent)}

.note{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.note.fix{border:1px solid var(--warn);background:var(--warn-bg)}
.note.cmp{background:var(--surface-3)}
.callout{display:flex;gap:12px;align-items:stretch}
.iti{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.iti div{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2)}
.iti b{font-family:var(--mono);letter-spacing:.08em;font-size:13px;color:var(--accent-ink)}
@media (max-width:520px){.iti{grid-template-columns:1fr}}

details.more{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.more summary{cursor:pointer;padding:10px 14px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.more > div{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}

/* graph */
svg.graph{display:block;width:100%;height:auto;touch-action:pan-y;font-family:var(--serif)}
.g-grid{stroke:var(--line-2);stroke-width:1}
.g-axis{stroke:var(--ink-3);stroke-width:1.4;fill:none}
.axis-head{fill:var(--ink-3)}
.g-tick{fill:var(--ink-3);font-family:var(--font);font-size:13px}
.g-axl{fill:var(--ink-2);font-style:italic;font-size:17px}
.cv{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s,stroke-width .2s,opacity .2s}
.cv.c1{stroke:var(--c1)} .cv.c2{stroke:var(--c2)} .cv.cn{stroke:var(--cn)} .cv.cx{stroke:var(--ink-2)}
.cv.thick{stroke-width:4.4}
.cv.dash{stroke-dasharray:10 6}
.cv.faint{opacity:.35;stroke-dasharray:6 6}
.cv.dim{opacity:.25}
.hit{fill:none;stroke:transparent;stroke-width:22;cursor:pointer;pointer-events:stroke}
.ar{stroke:none;transition:fill-opacity .25s,fill .25s}
.ar.area{fill:var(--area);fill-opacity:var(--area-op)}
.ar.reg2{fill:var(--reg2);fill-opacity:var(--reg2-op)}
.ar.regG{fill:var(--regG);fill-opacity:var(--regG-op)}
.ar.q{fill:var(--ink-3);fill-opacity:.12}
.ar.bad{fill:var(--bad);fill-opacity:.18}
.ar.hl{fill-opacity:.55}
.ar.dim{fill-opacity:.08}
.ar.click{cursor:pointer}
.ar.click:hover{fill-opacity:.4}
.sl{fill:var(--slice);fill-opacity:var(--slice-op);stroke:var(--slice);stroke-width:1.4}
.sl.thin{stroke-width:.6}
.sl.nost{stroke:none;fill-opacity:.5}
.sl.g1{fill:var(--regG);stroke:var(--ink-3);fill-opacity:.5}
.sl.g2{fill:var(--reg2);stroke:var(--reg2);fill-opacity:.45}
.sl.hot{fill-opacity:.7;stroke-width:2}
.gd{stroke:var(--ink-3);stroke-width:1.3;stroke-dasharray:5 5;fill:none}
.gd.solid{stroke-dasharray:none;opacity:.8}
.gd.red{stroke:var(--bad);stroke-width:1.4}
.gd.acc{stroke:var(--accent);stroke-width:2;stroke-dasharray:none}
.br{stroke:var(--ink-2);stroke-width:1.4;fill:none}
.br.k1{stroke:var(--c1)} .br.k2{stroke:var(--c2)} .br.kS{stroke:var(--slice);stroke-width:2}
.pt{fill:var(--pt);stroke:var(--surface);stroke-width:2.2}
.pt.c1{fill:var(--c1)} .pt.c2{fill:var(--c2)}
.pt.pulse{animation:pulse 1.4s ease-in-out 2}
@keyframes pulse{50%{r:9}}
.lb{font-size:16px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.lb.it{font-style:italic}
.lb.c1{fill:var(--c1)} .lb.c2{fill:var(--c2)} .lb.cn{fill:var(--cn)} .lb.m{fill:var(--ink-2);font-size:14px}
.lb.sm{font-size:13.5px}
.lb.big{font-size:20px;font-weight:600}
.lb.kS{fill:var(--slice)} .lb.red{fill:var(--bad)} .lb.acc{fill:var(--accent-ink)}
.lb.ui{font-family:var(--font);font-weight:600}
g.hidden{display:none}

/* cover */
.cover{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:34px;align-items:center;min-height:calc(100% - 20px)}
@media (max-width:920px){.cover{grid-template-columns:minmax(0,1fr)}}
.cover h1{font-size:clamp(36px,5vw,62px);font-weight:800;letter-spacing:-.02em;line-height:1.02}
.cover h1 span{display:block;color:var(--accent)}
.cover .who{display:grid;gap:2px;font-size:15px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:12px}
.cover .who b{color:var(--ink);font-size:17px}
.cover ol.obj{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--ink-2);font-size:15.5px}

/* menu */
.menu{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-start;background:rgba(10,20,18,.45)}
.menu[hidden]{display:none!important}
.menu-in{width:min(430px,100%);height:100%;background:var(--surface);overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px;box-shadow:4px 0 30px rgba(0,0,0,.2)}
.menu-sec{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:8px 4px 2px}
.menu-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.menu-list button{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) 22px;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 8px;border-radius:7px;cursor:pointer;font-size:15px}
.menu-list button:hover{background:var(--surface-2)}
.menu-list button.cur{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.menu-list .no{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.menu-list .st{font-size:13px;color:var(--ok);text-align:center}
.menu-list .st.v{color:var(--ink-3)}

/* tree */
.tree{display:grid;gap:14px}
.tnode{border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);transition:border-color .25s,background .25s}
.tnode.q{font-weight:600}
.tnode.leaf{font-family:var(--mono);font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-align:center;font-weight:600}
.tnode.on{border-color:var(--accent);background:var(--accent-soft)}
.tbranch{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.tarrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin:0 0 6px 4px}
.tarrow.on{color:var(--accent-ink);font-weight:600}
.tcol{display:flex;flex-direction:column}

/* workflow */
.wf{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
@media (max-width:1100px){.wf{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wf button{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;font-size:13px;font-weight:600;line-height:1.25;min-height:72px}
.wf button span{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.wf button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.wf button.past{border-color:var(--accent-2)}

/* solver */
.stage{display:flex;flex-direction:column;gap:8px;animation:fadeIn .3s ease}
.stage-h{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}

/* quiz */
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.order li{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-3);cursor:grab;font-size:15px}
.order li.drag{opacity:.5}
.order li.over{border-color:var(--accent)}
.order li .no{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:18px}
.order li .grow{flex:1}
.order li button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:30px;cursor:pointer}
.score{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.sumtab{width:100%;border-collapse:collapse;font-size:15px}
.sumtab th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.sumtab td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tablewrap{overflow-x:auto}
textarea{width:100%;min-height:110px;border-radius:8px;border:1px solid var(--line);background:var(--surface-3);padding:10px;font-size:15px;resize:vertical}

.fx-parts{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:20px}
.fx-parts .eq{padding:0 4px}
.fx-part{border:1.5px dashed var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;cursor:pointer;min-height:48px}
.fx-part:hover,.fx-part.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.fx-part.p1{color:var(--c1)} .fx-part.p2{color:var(--c2)}

@media (max-width:600px){
  .slide{padding-inline:16px;padding-block:16px 32px}
  .topbar,.navbar{padding-inline:12px}
  .btn.nav{min-width:0;padding-inline:10px}
  .btn.nav .long{display:none}
  .field-grid{grid-template-columns:minmax(0,1fr)}
  .plate{font-size:16px} .plate.big{font-size:17px}
  .step > div{font-size:15px}
  .lb{font-size:22px} .lb.sm{font-size:19px} .lb.big{font-size:25px} .g-tick{font-size:17px} .g-axl{font-size:21px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}main{scroll-behavior:auto}}

    <button class="btn" id="btnMenu" type="button" aria-haspopup="dialog" aria-controls="menu">☰ MENU</button>
    <div class="brand"><b id="hdrTitle">Aplikasi Integral – Luas Daerah</b><span>Kalkulus 2 · Pertemuan 2 · Teknik Industri UICI</span></div>
    <button class="btn" id="btnReset" type="button" title="Kembalikan slide ini ke keadaan awal">↺ RESET</button>
  </header>
  <div class="progress" aria-hidden="true"><i id="prog"></i></div>
  <main id="main" tabindex="-1"></main>
  <nav class="navbar" aria-label="Navigasi slide">
    <button class="btn nav" id="btnPrev" type="button">← <span class="long">PREVIOUS</span></button>
    <div class="counter"><span id="cnt">SLIDE 01 / 26</span><small id="cntSec"></small></div>
    <button class="btn nav primary" id="btnNext" type="button"><span class="long">NEXT</span> →</button>
  </nav>
</div>
<div class="menu" id="menu" hidden role="dialog" aria-modal="true" aria-label="Daftar slide">
  <div class="menu-in">
    <div class="row" style="justify-content:space-between">
      <h3>Daftar slide</h3>
      <button class="btn sm" id="btnMenuClose" type="button">TUTUP ✕</button>
    </div>
    <p class="small muted">✓ = interaksi di slide selesai · • = sudah dibuka</p>
    <div id="menuBody"></div>
  </div>
</div>

    const t = clamp((now - t0) / dur, 0, 1); const e = 1 - Math.pow(1 - t, 3);

}
function growAreaX(g, top, bot, a, b, cls, dur, done) {
  const p = g.add('area', 'path', { class: 'ar ' + (cls || 'area'), d: '' });
  animatePath(p, t => g.dAreaX(top, bot, a, a + (b - a) * t, Math.max(8, Math.round(160 * t))), dur, done); return p;
}
function growAreaY(g, right, left, c, d, cls, dur, done) {
  const p = g.add('area', 'path', { class: 'ar ' + (cls || 'area'), d: '' });
  animatePath(p, t => g.dAreaY(right, left, c, c + (d - c) * t, Math.max(8, Math.round(160 * t))), dur, done); return p;
}

/* Numeric answer with exact form */
function numq(parent, o) {
  const wrap = E('div', { class: 'q' });
  if (o.tag) wrap.append(E('div', { class: 'q-tag' }, o.tag));

  const id = uid('num');
  const inp = E('input', { id, type: 'text', inputmode: 'text', autocomplete: 'off', placeholder: o.ph || 'mis. 1/6', 'aria-label': 'Jawaban' });
  const check = E('button', { class: 'btn primary sm', type: 'button' }, 'CHECK ANSWER');
  const row = E('div', { class: 'num-row' }, o.pre ? E('span', { html: o.pre }) : null, inp, check);
  const fb = E('div', { class: 'fb', hidden: true, 'aria-live': 'polite' });
  const hintBox = E('div', { class: 'hint', hidden: true });
  let solved = false, hintK = 0, tries = 0;
  const hints = [].concat(o.hint || []);
  const hb = hints.length ? E('button', { class: 'btn sm', type: 'button', onclick: () => { hintBox.hidden = false; const hk = hints[Math.min(hintK, hints.length - 1)]; hintK++; setMath(hintBox, `<strong>Hint${hints.length > 1 ? ' ' + Math.min(hintK, hints.length) : ''}.</strong> ` + hk); if (hintK >= hints.length) hb.disabled = true; } }, 'SHOW HINT') : null;
  const sb = E('button', { class: 'btn sm', type: 'button', onclick: () => finish(false, true) }, 'SHOW SOLUTION');
  const tools = E('div', { class: 'q-tools' }, hb, sb);
  function finish(ok, shown) {
    if (solved) return; solved = true; inp.disabled = true; check.disabled = true; tools.hidden = true;
    if (shown) { inp.value = o.exactTxt || ''; setFb(fb, 'info', o.sol || ''); }

  const doCheck = () => {

    tries++;

/* Step-by-step reveal. steps: [{label, html, on}] */
function stepper(parent, steps, o = {}) {
  const wrap = E('div', { class: 'stepper' });
  const out = E('ol', { class: 'steps' });
  let i = 0; let btns = [], next;
  if (o.labels) {
    const row = E('div', { class: 'step-btns' });
    btns = steps.map((s, k) => { const b = E('button', { class: 'btn sm step-btn', type: 'button', disabled: k > 0 }, E('span', { class: 'n' }, k + 1), s.label); b.addEventListener('click', () => { if (k === i) reveal(); }); row.append(b); return b; });
    wrap.append(row);
  } else {
    next = E('button', { class: 'btn primary', type: 'button' }, '');
    next.addEventListener('click', () => reveal());
    wrap.append(E('div', { class: 'row' }, next));
  }
  const upd = () => {
    if (next) { next.textContent = i < steps.length ? `${o.btnText || 'LIHAT LANGKAH'} (${i + 1}/${steps.length})` : 'SEMUA LANGKAH TERBUKA ✓'; next.disabled = i >= steps.length; }
    btns.forEach((b, k) => { b.disabled = k !== i; b.classList.toggle('done', k < i); });
  };
  function reveal() {
    if (i >= steps.length) return; const s = steps[i];
    const li = E('li', { class: 'step' }, E('div', { html: (s.label && o.labels ? `<span class="st-h">${s.label}</span>` : (s.head ? `<span class="st-h">${s.head}</span>` : '')) + s.html }));
    out.append(li); typeset(li); i++; upd(); s.on && s.on();
    if (i === steps.length) { o.key && App.done(o.key); o.onDone && o.onDone(); }
  }
  wrap.append(out); parent.append(wrap); upd();
  return { reveal, get i() { return i; } };
}
function seg(parent, opts, onChange, init = 0, aria) {
  const w = E('div', { class: 'seg', role: 'group', 'aria-label': aria || 'Pilihan' });
  const btns = opts.map((t, i) => { const b = E('button', { type: 'button', class: 'seg-b', 'aria-pressed': String(i === init), html: t }); b.addEventListener('click', () => { btns.forEach((x, j) => x.setAttribute('aria-pressed', String(j === i))); onChange(i); }); w.append(b); return b; });
  parent.append(w); if (init != null && init >= 0) onChange(init);
  return { el: w, set(i) { btns[i].click(); } };
}
function slider(parent, o) {
  const id = uid('rng');
  const r = E('input', { type: 'range', id, min: o.min, max: o.max, step: o.step, value: o.value });
  const out = E('output', { for: id });

  r.addEventListener('input', upd); parent.append(w); upd();

}
function readout(parent, items) {

}

function chain(fns) { let k = 0; const run = () => { if (k < fns.length) { const f = fns[k++]; let called = false; f(() => { if (!called) { called = true; run(); } }); } }; run(); }
function badge(kind, text) { return `<span class="badge ${kind}">${text}</span>`; }

<script>

/* ---------- shared: y = x^2 - 1 on [-2, 2] ---------- */
function graphX2m1(host) {
  const g = new Graph(host, { x: [-2.6, 2.6], y: [-1.6, 3.6], gx: .5, lx: 1, aria: 'Kurva y = x kuadrat minus 1 dengan garis x = -2 dan x = 2' });
  const f = x => x * x - 1;
  const R = [
    g.areaX(f, () => 0, -2, -1, { cls: 'q' }),
    g.areaX(() => 0, f, -1, 1, { cls: 'q' }),
    g.areaX(f, () => 0, 1, 2, { cls: 'q' })];
  g.curve(f, -2.6, 2.6, { cls: 'c1' });
  g.vline(-2, { cls: 'gd solid' }); g.vline(2, { cls: 'gd solid' });
  g.text(-2, -1.45, 'x = −2', { anchor: 'middle', cls: 'm' }); g.text(2, -1.45, 'x = 2', { anchor: 'middle', cls: 'm' });
  g.text(0.62, 2.9, 'y = x² − 1', { cls: 'c1 it', dx: 30 });
  const L = [g.text(-1.62, 0.55, 'L1', { cls: 'big ui red', anchor: 'middle' }), g.text(0.5, -0.5, 'L2', { cls: 'big ui red', anchor: 'middle' }), g.text(1.62, 0.55, 'L3', { cls: 'big ui red', anchor: 'middle' })];
  return { g, f, R, L };
}

/* ---------- 05 SOLUTION |x^2-1| ---------- */
def({
  sec: 'Konsep luas', title: 'Penyelesaian ∫|x² − 1| dx', build(r) {
    const F = frame(r, {
      eyebrow: eb(5, 'Penyelesaian', badge('pdf', 'Jawab · hal. 5')),

      lead: 'Setiap subregion dihitung dengan fungsi yang bernilai positif di bagian itu, lalu hasilnya dijumlahkan.',
      cap: 'Amber: di atas sumbu-x. Cyan: di bawah sumbu-x.'
    });
    const { g, R, L } = graphX2m1(F.gHost);
    R[0].setAttribute('class', 'ar area'); R[1].setAttribute('class', 'ar reg2'); R[2].setAttribute('class', 'ar area');
    g.dot(-1, 0); g.dot(1, 0);
    const P = F.panel;
    const hl = ks => R.forEach((p, k) => p.classList.toggle('hl', ks.includes(k)));
    const fix = E('div', { class: 'note fix', hidden: true, html: `<div class="row">${badge('fix', 'Koreksi terhadap materi')}</div>
      <p>Pada slide materi (hal. 5), integral L2 dihitung sebagai ${m`\big[x-\tfrac{x^3}{3}\big]_{0}^{1}=\tfrac23`} (batas bawah 0), lalu ditulis sebagai 2, sehingga hasil akhirnya tertulis ${m`\tfrac{14}{3}`}.</p>
      <p>Daerah L2 membentang dari ${m`x=-1`} sampai ${m`x=1`}, sehingga ${m`L2=\tfrac43`} dan luas totalnya <b>4</b>.</p>
      <p class="small muted">Cek dengan simetri:</p>${dm`\begin{aligned}&2\Big[\int_0^1(1-x^2)\,dx+\int_1^2(x^2-1)\,dx\Big]\\&=2\big(\tfrac23+\tfrac43\big)=4\end{aligned}`}` });
    stepper(P, [
      { head: 'Pisahkan menurut subregion', html: dm`\int_{-2}^{2}|x^2-1|\,dx = L1+L2+L3`, on: () => hl([0, 1, 2]) },
      { head: 'Tulis fungsi positif di tiap bagian', html: dm`\begin{aligned}&=\int_{-2}^{-1}(x^2-1)\,dx+\int_{-1}^{1}(1-x^2)\,dx\\&\quad+\int_{1}^{2}(x^2-1)\,dx\end{aligned}`, on: () => hl([1]) },
      { head: 'Antiturunan', html: dm`\begin{aligned}&=\Big[\tfrac{x^3}{3}-x\Big]_{-2}^{-1}+\Big[x-\tfrac{x^3}{3}\Big]_{-1}^{1}\\&\quad+\Big[\tfrac{x^3}{3}-x\Big]_{1}^{2}\end{aligned}`, on: () => hl([0, 2]) },
      { head: 'Substitusi batas', html: dm`\begin{aligned}&=\Big(\tfrac23-\big(-\tfrac23\big)\Big)+\Big(\tfrac23-\big(-\tfrac23\big)\Big)\\&\quad+\Big(\tfrac23-\big(-\tfrac23\big)\Big)\end{aligned}`, on: () => { hl([]); L[0].textContent = 'L1 = 4/3'; L[1].textContent = 'L2 = 4/3'; L[2].textContent = 'L3 = 4/3'; } },
      { head: 'Jumlahkan', html: `${dm`=\tfrac43+\tfrac43+\tfrac43=4`}<p>Luas daerah yang dimaksud adalah <b>4 satuan luas</b>.</p>`, on: () => hl([0, 1, 2]) }
    ], { key: 'x2m1sol', onDone: () => { fix.hidden = false; typeset(fix); } });

  }
});

    const g = new Graph(F.gHost, { x: [-0.3, 5], y: [-1.5, 3.8], gx: .5, lx: 20, ly: 20 });

    g.seg(a, gg(a), a, f(a), { cls: 'gd solid' }); g.seg(b, gg(b), b, f(b), { cls: 'gd solid' });
    g.text(a, 0, 'a', { dy: 20, anchor: 'middle', cls: 'it' }); g.text(b, 0, 'b', { dy: 20, anchor: 'middle', cls: 'it' });
    g.text(2.2, 3, 'y = f(x)', { dy: -10, anchor: 'middle', cls: 'c1 it' }); g.text(3.05, 0.35 * 1.45 ** 2 - 1, 'y = g(x)', { dy: 24, anchor: 'middle', cls: 'c2 it' });
    g.text(3.35, 1.7, 'S', { cls: 'it big' });
    const P = F.panel;
    blk(P, `<p class="src">Misalkan ${m`f(x)\ge g(x)`} pada ${m`[a,b]`}. Kita ingin menentukan luas daerah yang dibatasi kurva ${m`y=f(x)`}, ${m`y=g(x)`}, garis ${m`x=a`}, dan garis ${m`x=b`}. Luas irisan ke-${m`i`} dapat ditaksir, lalu dijumlahkan dan diambil limitnya.</p>`);
    const ctl = E('div', { class: 'block' }); P.append(ctl);
    const ro = readout(P, [['f', 'f(xᵢ*)', 'k1'], ['g', 'g(xᵢ*)', 'k2'], ['h', 'Tinggi f − g', 'kS'], ['A', 'ΔLᵢ = tinggi·Δx', 'kS']]);
    slider(ctl, {
      label: `Posisi irisan ${m`x_i^*`}`, min: a + dx / 2, max: b - dx / 2, step: .05, value: 1.3, oninput: v => {
        g.clear('slices'); g.clear('top'); g.clear('guides');
        g.seg(a, gg(a), a, f(a), { cls: 'gd solid' }); g.seg(b, gg(b), b, f(b), { cls: 'gd solid' });
        const fv = f(v), gv = gg(v);
        g.rect(v - dx / 2, v + dx / 2, gv, fv, { cls: 'hot' }); g.seg(v, gv, v, fv, { cls: 'gd' });
        g.vbrace(v - dx / 2 - 0.08, 0, fv, 'f(xᵢ*)', { side: 'left', cls: 'k1', tcls: 'c1' });
        if (gv < 0) g.vbrace(v - dx / 2 - 0.08, gv, 0, '−g(xᵢ*)', { side: 'left', cls: 'k2', tcls: 'c2' });
        g.vbrace(v + dx / 2 + 0.08, gv, fv, 'f(xᵢ*) − g(xᵢ*)', { cls: 'kS', tcls: 'kS' });
        g.hbrace(Math.min(gv, 0) - 0.12, v - dx / 2, v + dx / 2, 'Δx', { cls: 'kS', tcls: 'kS' });
        g.text(v, (fv + gv) / 2, 'ΔLᵢ', { anchor: 'middle', cls: 'sm ui', dy: 5 });

    blk(P, `<div class="iti"><div><b>IRIS</b>Potong daerah menjadi irisan vertikal selebar Δx.</div><div><b>TAKSIR</b>Luas satu irisan ≈ tinggi × lebar = [f − g]Δx.</div><div><b>INTEGRALKAN</b>Jumlahkan semua irisan dan ambil limitnya.</div></div>`);
    mcq(P, {
      key: 'duakurva', q: `Geser irisan ke daerah tempat ${m`g(x_i^*)\lt 0`}. Berapa tinggi irisannya?`,
      opts: [

        { t: m`f(x_i^*)-\big|g(x_i^*)\big|`, fb: 'Bagian di bawah sumbu-x juga termasuk tinggi irisan, jadi harus ditambahkan, bukan dikurangi.' },
        { t: m`f(x_i^*)`, fb: 'Itu hanya tinggi dari sumbu-x ke kurva atas. Irisan memanjang sampai kurva bawah.' }]
    });
  }
});

/* ---------- 08 INTERSECTION ---------- */
def({
  sec: 'Irisan vertikal (dx)', title: 'Menentukan titik potong', build(r) {
    const F = frame(r, {
      eyebrow: eb(8, 'Titik potong', badge('pdf', 'Contoh Soal 1 · hal. 8')),
      title: 'Menentukan titik potong',
      lead: 'Dua kurva berpotongan ketika nilai y-nya sama. Absis titik potong menjadi batas integrasi.',
      cap: 'Tekan PUTAR. Dua titik bergerak di kedua kurva; jarak vertikalnya menjadi nol di titik potong.', bar: true
    });
    const g = new Graph(F.gHost, { x: [-0.6, 1.5], y: [-0.45, 1.6], gx: .25, lx: .5 });
    g.curve(f_x, -0.6, 1.5, { cls: 'c1' }); g.curve(f_x2, -0.6, 1.5, { cls: 'c2' });
    g.text(1.28, 1.28, 'y = x', { cls: 'c1 it', dx: 8, dy: 12 }); g.text(1.18, 1.39, 'y = x²', { cls: 'c2 it', anchor: 'end', dx: -8 });
    const found = new Set(); let running = false;
    const markHit = x => { if (found.has(x)) return; found.add(x); g.dot(x, x, { layer: 'top', cls: 'pulse' }); g.text(x, x, x ? '(1, 1)' : '(0, 0)', { layer: 'top', dx: x ? 10 : 10, dy: x ? 20 : -10, cls: 'm' }); };
    const play = E('button', { class: 'btn primary sm', type: 'button' }, '▶ PUTAR');
    F.figBar.append(play);
    play.addEventListener('click', () => {
      if (running) return; running = true; play.disabled = true;
      const t0 = performance.now(), dur = reduced() ? 10 : 5200; let prev = null;
      const step = now => {
        if (!play.isConnected) return;
        const p = clamp((now - t0) / dur, 0, 1), t = -0.5 + 1.85 * p;
        g.clear('marks'); g.clear('slices');
        const gap = t - t * t;
        g.dot(t, t, { cls: 'c1' }); g.dot(t, t * t, { cls: 'c2' });
        g.seg(t, t * t, t, t, { cls: 'br kS', layer: 'slices' });
        g.text(t, Math.max(t, t * t), '|x − x²| = ' + fmt(Math.abs(gap), 2), { layer: 'marks', dy: -14, anchor: 'middle', cls: 'sm ui' });
        if (prev !== null) { if (prev < 0 && gap >= 0) markHit(0); if (prev > 0 && gap <= 0) markHit(1); }
        prev = gap;
        if (p < 1) requestAnimationFrame(step); else { running = false; play.disabled = false; play.textContent = '▶ PUTAR LAGI'; markHit(0); markHit(1); }
      };
      requestAnimationFrame(step);
    });
    const P = F.panel;
    blk(P, `<ol class="flow"><li>f(x) = g(x)</li><li>Bentuk persamaan</li><li>Selesaikan</li><li>Batas x</li></ol>`);
    numq(P, {
      q: `Kurva ${m`y=x`} dan ${m`y=x^2`} berpotongan di ${m`x=0`} dan di ${m`x=\,?`}`, pre: m`x=`, ans: 1, ph: 'mis. 2', key: 'titikpotong',
      hint: [`Samakan kedua persamaan: ${m`x=x^2`}.`, `Pindahkan ke satu ruas lalu faktorkan: ${m`x(x-1)=0`}.`],
      okFb: `Titik potongnya ${m`(0,0)`} dan ${m`(1,1)`}.`, sol: `${m`x=x^2\Rightarrow x(x-1)=0\Rightarrow x=0`} atau ${m`x=1`}.`
    });
    blk(P, `<div class="q-tag">Intersection calculator · langkah aljabar</div>`);
    stepper(P, [
      { head: 'Samakan kedua persamaan', html: dm`x=x^2` },
      { head: 'Bentuk persamaan = 0', html: dm`x^2-x=0` },
      { head: 'Faktorkan', html: dm`x(x-1)=0` },
      { head: 'Selesaikan', html: `${dm`x=0 \quad\text{dan}\quad x=1`}<p>Substitusi ke ${m`y=x`}: titik potong ${m`(0,0)`} dan ${m`(1,1)`}.</p>`, on: () => { markHit(0); markHit(1); } }
    ]);
  }
});

/* ---------- shared graph for y=x, y=x^2 ---------- */
function graphEx1(host, neutral) {
  const g = new Graph(host, { x: [-0.2, 1.3], y: [-0.15, 1.3], gx: .25, lx: .5, aria: 'Kurva y = x dan y = x kuadrat' });
  const pA = g.curve(f_x, -0.2, 1.3, { cls: neutral ? 'cn' : 'c1' }), pB = g.curve(f_x2, -0.2, 1.3, { cls: neutral ? 'cn dash' : 'c2' });
  const lA = g.text(1.12, 1.12, 'y = x', { cls: (neutral ? 'cn' : 'c1') + ' it', dx: 10, dy: 12 });
  const lB = g.text(1.1, 1.21, 'y = x²', { cls: (neutral ? 'cn' : 'c2') + ' it', anchor: 'end', dx: -10 });
  return { g, pA, pB, lA, lB };
}

      { label: 'Kurva atas', html: `Kurva atas: ${m`y=x`}, karena pada ${m`0\lt x\lt1`} berlaku ${m`x\gt x^2`}.`, on: () => { pA.setAttribute('class', 'cv c1 thick'); lA.setAttribute('class', 'lb c1 it'); lA.textContent = 'y = x (atas)'; } },
      { label: 'Kurva bawah', html: `Kurva bawah: ${m`y=x^2`}.`, on: () => { pB.setAttribute('class', 'cv c2 thick'); lB.setAttribute('class', 'lb c2 it'); lB.textContent = 'y = x² (bawah)'; } },

/* ---------- 10 INTEGRAL BUILDER ---------- */
def({
  sec: 'Irisan vertikal (dx)', title: 'Membangun integral dari grafik', build(r) {
    const F = frame(r, {
      eyebrow: eb(10, 'Integral builder'),
      title: 'Membangun integral dari grafik',
      lead: 'Integral luas dibangun dari informasi pada grafik: batas dari titik potong, integran dari kurva atas dikurangi kurva bawah. Pilih setiap bagian, lalu tekan HITUNG.',
      cap: 'Daerah yang diarsir mengikuti pilihan Anda. Warna merah menandai bagian dengan tinggi irisan negatif (fungsi atas < fungsi bawah).'
    });
    const { g } = graphEx1(F.gHost, false);
    g.dot(0, 0); g.dot(1, 1);
    const FN = { x: { tex: 'x', txt: 'x', c: [0, 1], f: f_x }, x2: { tex: 'x^2', txt: 'x²', c: [0, 0, 1], f: f_x2 }, z: { tex: '0', txt: '0 (sumbu x)', c: [0], f: () => 0 } };
    const P = F.panel;
    const mkSel = (label, opts, val) => { const id = uid('sel'); const s = E('select', { id }); opts.forEach(([v, t]) => s.append(E('option', { value: v, selected: v === val }, t))); return [E('label', { class: 'field', for: id }, label, s), s]; };
    const lims = [['-1', '−1'], ['0', '0'], ['1', '1'], ['2', '2']];
    const fns = [['x', 'x'], ['x2', 'x²'], ['z', '0 (sumbu x)']];
    const [l1, sLo] = mkSel('BATAS BAWAH', lims, '-1'), [l2, sHi] = mkSel('BATAS ATAS', lims, '1'), [l3, sT] = mkSel('FUNGSI ATAS', fns, 'x2'), [l4, sB] = mkSel('FUNGSI BAWAH', fns, 'x');
    P.append(E('div', { class: 'field-grid' }, l1, l2, l3, l4));
    const live = E('div', { class: 'plate big' }); P.append(live);
    const hit = E('button', { class: 'btn primary', type: 'button' }, 'HITUNG');
    P.append(E('div', { class: 'row' }, hit));
    const fb = E('div', { class: 'fb', hidden: true, 'aria-live': 'polite' }); P.append(fb);
    const sol = E('div', { class: 'plate', hidden: true }); P.append(sol);
    const state = () => ({ lo: +sLo.value, hi: +sHi.value, T: FN[sT.value], B: FN[sB.value], tk: sT.value, bk: sB.value });
    const upd = () => {
      const s = state(); fb.hidden = true; sol.hidden = true;
      const bt = s.bk === 'z' ? '0' : s.B.tex;
      setMath(live, `<span class="lbl">Integral yang terbentuk</span>${dm`A=\int_{${s.lo}}^{${s.hi}}\big(${s.T.tex}-${bt}\big)\,dx`}`);
      g.clear('area'); g.clear('guides'); g.clear('slices');
      g.vline(s.lo, { cls: 'gd acc' }); g.vline(s.hi, { cls: 'gd acc' });
      if (s.lo < s.hi && s.tk !== s.bk) {
        g.areaX(x => Math.max(s.T.f(x), s.B.f(x)), s.B.f, s.lo, s.hi, { cls: 'area' });
        g.areaX(s.B.f, x => Math.min(s.T.f(x), s.B.f(x)), s.lo, s.hi, { cls: 'bad' });
        const xs = s.lo + (s.hi - s.lo) * 0.62; g.rect(xs - .03, xs + .03, s.B.f(xs), s.T.f(xs), { cls: 'hot' });
      }
    };
    [sLo, sHi, sT, sB].forEach(s => s.addEventListener('change', upd));
    hit.addEventListener('click', () => {
      const s = state(); const val = s.lo < s.hi && s.tk !== s.bk ? polyInt(s.T.c.map((c, k) => c - (s.B.c[k] || 0)).concat(s.B.c.slice(s.T.c.length).map(c => -c)), s.lo, s.hi) : null;
      const vtxt = val ? ` Integral yang Anda bangun bernilai ${m`${val.tex()}`}.` : '';
      if (s.lo >= s.hi) return setFb(fb, 'bad', 'Batas bawah harus lebih kecil dari batas atas.');
      if (s.tk === s.bk) return setFb(fb, 'bad', 'Fungsi atas dan fungsi bawah sama, sehingga tinggi irisan menjadi 0. Periksa kembali kurva atas dan kurva bawah.');
      if (!(s.lo === 0 && s.hi === 1)) return setFb(fb, 'bad', `Batas integrasi harus berasal dari titik potong kedua kurva, yaitu ${m`x=0`} dan ${m`x=1`}.` + vtxt);
      if (s.tk === 'z' || s.bk === 'z') return setFb(fb, 'bad', 'Periksa kembali kurva atas dan kurva bawah. Sumbu x bukan batas daerah ini; daerahnya dibatasi oleh y = x dan y = x².' + vtxt);
      if (s.tk === 'x2') return setFb(fb, 'bad', 'Periksa kembali kurva atas dan kurva bawah.' + vtxt + ' Hasil negatif menandakan urutannya terbalik.');
      setFb(fb, 'ok', `Tepat. Tinggi irisan vertikal adalah ${m`x-x^2`}.`);
      sol.hidden = false; setMath(sol, dm`\begin{aligned}A&=\int_0^1\big(x-x^2\big)\,dx=\Big[\frac{x^2}{2}-\frac{x^3}{3}\Big]_0^1\\&=\frac12-\frac13=\frac16\end{aligned}`);
      App.done('builder');
    });
    upd();
  }
});

/* ---------- 11 SLICES TO TOTAL AREA ---------- */
def({
  sec: 'Irisan vertikal (dx)', title: 'Dari irisan ke luas total', build(r) {
    const F = frame(r, {
      eyebrow: eb(11, 'Irisan → luas'),
      title: 'Dari irisan ke luas total',
      lead: `Satu irisan memberi taksiran kasar. Semakin banyak irisan, jumlah luasnya semakin dekat ke ${m`\tfrac16`}. Pada limitnya, jumlah itu menjadi integral.`, bar: true,
      cap: `Irisan diambil di titik tengah setiap subinterval, antara ${m`y=x^2`} dan ${m`y=x`}.`
    });
    const { g } = graphEx1(F.gHost, false);
    const P = F.panel;
    const ro = readout(P, [['n', 'Jumlah irisan'], ['s', 'Σ [f − g]Δx', 'kS'], ['e', 'Luas eksak', 'kA'], ['d', 'Selisih']]);
    const fx = E('div', { class: 'plate big' }); P.append(fx);
    const ns = [1, 10, 50, 100, 0];
    const draw = n => {
      g.clear('slices'); g.clear('area');
      if (n) {
        g.areaX(f_x, f_x2, 0, 1, { cls: 'q' });
        for (let i = 0; i < n; i++) { const x0 = i / n, xm = (i + .5) / n; g.rect(x0, x0 + 1 / n, xm * xm, xm, { cls: n >= 50 ? 'thin' : '' }); }
        const s = 1 / 6 + 1 / (12 * n * n);
        ro.n.textContent = n; ro.s.textContent = fmt(s, 6); ro.d.textContent = fmt(s - 1 / 6, 6);
        setMath(fx, `<span class="lbl">Taksiran dengan ${n} irisan</span>${dm`\Delta A\approx\big[f(x)-g(x)\big]\,\Delta x \qquad A\approx\sum_{i=1}^{${n}}\big[x_i-x_i^2\big]\,\Delta x`}`);
      } else {
        growAreaX(g, f_x, f_x2, 0, 1, 'area', 900);
        ro.n.textContent = '∞'; ro.s.textContent = '1/6'; ro.d.textContent = '0';
        setMath(fx, `<span class="lbl">Limit: integral tentu</span>${dm`A=\int_a^b\big[f(x)-g(x)\big]\,dx=\int_0^1\big[x-x^2\big]\,dx=\frac16`}`);
        App.done('irisanluas');
      }
      ro.e.textContent = '1/6 ≈ 0,166667';
    };
    const sg = seg(F.figBar, ['n = 1', 'n = 10', 'n = 50', 'n = 100', '∫'], i => draw(ns[i]), 0, 'Jumlah irisan');
    const play = E('button', { class: 'btn primary sm', type: 'button' }, '▶ PUTAR ANIMASI'); F.figBar.append(play);
    play.addEventListener('click', () => { play.disabled = true; let k = 0; const tick = () => { if (!play.isConnected) return; sg.set(k); k++; if (k < ns.length) setTimeout(tick, 1300); else play.disabled = false; }; tick(); });
  }
});

/* ---------- 12 CONTOH SOAL 3 ---------- */
def({
  sec: 'Irisan vertikal (dx)', title: 'Contoh 3: y = x² dan y = 2x − x²', build(r) {
    const F = frame(r, {
      eyebrow: eb(12, 'Contoh soal · coba dulu', badge('pdf', 'Contoh Soal 3 · hal. 15')),

      }),
      next => mcq(P, {

        hint: [`${m`y_T-y_B=2x-2x^2=2(x-x^2)`}.`, `Bandingkan dengan Contoh 1: ${m`\int_0^1(x-x^2)\,dx=\tfrac16`}.`],
        okFb: `${m`A=2\cdot\tfrac16=\tfrac13`}.`, sol: `${m`A=\int_0^1(2x-2x^2)\,dx=\tfrac13`}.`,

/* ---------- shared: x^2, -x+2, x-axis ---------- */
const topX = x => Math.min(x * x, 2 - x);
function graphEx2(host, o = {}) {
  const g = new Graph(host, Object.assign({ x: [-0.45, 2.6], y: [-0.4, 2.3], gx: .25, lx: .5, aria: 'Daerah di bawah y = x kuadrat dan y = -x + 2, di atas sumbu x' }, o));
  const [x0, x1] = g.o.x;
  g.curve(f_x2, x0, x1, { cls: 'c2', key: 'par' }); g.curve(x => 2 - x, x0, x1, { cls: 'c1', key: 'lin' });
  return g;
}

/* ---------- 13 ONE OR SEVERAL INTEGRALS ---------- */
def({
  sec: 'Pembagian region', title: 'Satu integral atau beberapa integral?', build(r) {
    const F = frame(r, {
      eyebrow: eb(13, 'Pembagian region', badge('pdf', 'Contoh Soal 2 · hal. 9')),
      title: 'Satu integral atau beberapa integral?',
      lead: `Hitung luas daerah yang dibatasi oleh sumbu x, ${m`y=x^2`}, dan ${m`y=-x+2`}. Sebelum menghitung, periksa apakah satu pasangan batas atas–bawah berlaku di seluruh interval.`,
      cap: 'Geser irisan vertikal dari kiri ke kanan dan perhatikan label batas atasnya.'
    });
    const g = new Graph(F.gHost, { x: [-2.5, 2.8], y: [-0.6, 4.6], gx: .5, lx: 1 });
    g.areaX(topX, () => 0, 0, 2, { cls: 'area' });
    g.curve(f_x2, -2.5, 2.8, { cls: 'c2' }); g.curve(x => 2 - x, -2.5, 2.8, { cls: 'c1' });
    g.text(-2.05, 4.3, 'y = x²', { cls: 'c2 it', anchor: 'end', dx: -6 }); g.text(2.35, -0.35, 'y = −x + 2', { cls: 'c1 it', anchor: 'end', dy: 4 });
    g.dot(-2, 4); g.text(-2, 4, '(−2, 4)', { dx: 10, dy: 4, cls: 'm' }); g.dot(1, 1); g.text(1, 1, '(1, 1)', { dx: 10, dy: -6, cls: 'm' });
    const P = F.panel; const ctl = E('div', { class: 'block' }); P.append(ctl);
    const ro = readout(P, [['x', 'Posisi x'], ['t', 'Batas atas'], ['b', 'Batas bawah']]);
    slider(ctl, {
      label: 'Posisi irisan vertikal x', min: .04, max: 1.96, step: .02, value: .5, oninput: v => {
        g.clear('slices'); g.clear('top'); const t = topX(v); const par = v < 1;
        g.rect(v - .04, v + .04, 0, t, { cls: 'hot' });
        g.text(v, t, par ? 'atas: y = x²' : 'atas: y = −x + 2', { layer: 'top', dy: -10, anchor: 'middle', cls: (par ? 'c2' : 'c1') + ' sm ui' });
        ro.x.textContent = fmt(v, 2); ro.t.textContent = par ? 'y = x²' : 'y = −x + 2'; ro.t.className = par ? 'k2' : 'k1'; ro.b.textContent = 'y = 0 (sumbu x)';
      }
    });
    blk(P, `<div class="plate"><span class="lbl">Titik potong kedua kurva · materi</span>${dm`x^2=-x+2\;\rightarrow\;x^2+x-2=0`}${dm`\rightarrow\;(x+2)(x-1)=0\;\rightarrow\;x=-2,\;x=1`}</div>`);
    blk(P, `<p class="small muted">Titik ${m`(-2,4)`} juga titik potong kedua kurva, tetapi daerah yang dimaksud berada di atas sumbu x dan di bawah kedua kurva, yaitu pada ${m`0\le x\le2`}. Jadi ${m`x=-2`} bukan batas daerah ini.</p>`);
    mcq(P, {
      key: 'bagi', q: 'Apakah satu fungsi atas–bawah berlaku untuk seluruh interval 0 ≤ x ≤ 2?', cols: true,
      opts: [
        { t: 'YA', fb: 'Geser irisan melewati x = 1. Label batas atasnya berubah dari y = x² menjadi y = −x + 2.' },
        { t: 'TIDAK', ok: true, fb: `Batas atas berubah di ${m`x=1`}: ${m`y=x^2`} untuk ${m`0\le x\le1`} dan ${m`y=-x+2`} untuk ${m`1\le x\le2`}. Dengan irisan vertikal, daerah harus dibagi menjadi 2 subregion.` }],
      onCorrect: () => { g.vline(1, { cls: 'gd acc' }); g.text(1, 0, 'x = 1', { dy: 20, dx: 4, cls: 'acc sm ui' }); }
    });
  }
});

<script>

/* ---------- 14 REGION SPLIT (dx) ---------- */
def({
  sec: 'Pembagian region', title: 'Region dibagi menjadi dua subregion', build(r) {
    const F = frame(r, {
      eyebrow: eb(14, 'Pembagian region', badge('pdf', 'Contoh Soal 2 · hal. 9–10')),

const xL4 = y => .5 * y * y - 3, xR4 = y => y + 1;
function graphEx4(host) {

  g.dot(-1, -2); g.dot(5, 4);
  g.text(-1, -2, '(−1, −2)', { dx: -10, dy: 4, anchor: 'end', cls: 'm' }); g.text(5, 4, '(5, 4)', { dx: -10, dy: -8, anchor: 'end', cls: 'm' });

}

/* ---------- pick-and-check (dropdown) question ---------- */
function pickq(parent, o) {
  const wrap = E('div', { class: 'q' });
  if (o.tag) wrap.append(E('div', { class: 'q-tag' }, o.tag));
  if (o.q) wrap.append(E('p', { class: 'q-text', html: o.q }));
  const sels = o.fields.map(([label, opts, init]) => { const id = uid('pk'); const s = E('select', { id }); opts.forEach(([v, t]) => s.append(E('option', { value: v, selected: v === init }, t))); wrap.append(E('label', { class: 'field', for: id }, label, s)); return s; });
  const grid = E('div', { class: 'field-grid' }); [...wrap.querySelectorAll('.field')].forEach(f => grid.append(f)); wrap.append(grid);
  const chk = E('button', { class: 'btn primary sm', type: 'button' }, 'CHECK ANSWER');
  const fb = E('div', { class: 'fb', hidden: true, 'aria-live': 'polite' });
  const hintBox = E('div', { class: 'hint', hidden: true });
  const tools = E('div', { class: 'q-tools' }, chk,
    o.hint ? E('button', { class: 'btn sm', type: 'button', onclick: () => { hintBox.hidden = false; setMath(hintBox, '<strong>Hint.</strong> ' + o.hint); } }, 'SHOW HINT') : null,
    E('button', { class: 'btn sm', type: 'button', onclick: () => { o.solVals.forEach((v, i) => sels[i].value = v); finish(true); } }, 'SHOW SOLUTION'));
  let solved = false;
  const finish = shown => { if (solved) return; solved = true; sels.forEach(s => s.disabled = true); tools.hidden = true; hintBox.hidden = true; setFb(fb, shown ? 'info' : 'ok', o.okFb || ''); o.onCorrect && o.onCorrect(!shown); };
  chk.addEventListener('click', () => { const r = o.check(sels.map(s => s.value)); if (r === true) finish(false); else setFb(fb, 'bad', r); });
  wrap.append(tools, fb, hintBox); parent.append(wrap); typeset(wrap);
  return wrap;
}

        const correct = ['Cari titik potong', 'Pilih dx atau dy', 'Tentukan batas integrasi', 'Tentukan fungsi pembatas', 'Bentuk integral', 'Hitung integral'];
        let items = [3, 0, 5, 1, 4, 2].map(k => correct[k]);
        const qd = E('div', { class: 'q' }, E('p', { class: 'q-text' }, 'Drag & drop: susun langkah penyelesaian luas daerah dari yang pertama. Seret item, atau pakai tombol ↑ ↓.'));
        const ol = E('ol', { class: 'order' }); qd.append(ol); left.append(qd);
        const fb = E('div', { class: 'fb', hidden: true }); const chk = E('button', { class: 'btn primary sm', type: 'button' }, 'CHECK ANSWER');
        qd.append(E('div', { class: 'q-tools' }, chk), fb);
        let dragK = null, tries = 0, solved = false;
        const draw = () => {
          ol.replaceChildren(...items.map((t, k) => {
            const li = E('li', { draggable: 'true' }, E('span', { class: 'no' }, k + 1), E('span', { class: 'grow' }, t),
              E('button', { type: 'button', 'aria-label': 'Naik', disabled: k === 0 || solved, onclick: () => { [items[k - 1], items[k]] = [items[k], items[k - 1]]; draw(); } }, '↑'),
              E('button', { type: 'button', 'aria-label': 'Turun', disabled: k === items.length - 1 || solved, onclick: () => { [items[k + 1], items[k]] = [items[k], items[k + 1]]; draw(); } }, '↓'));
            li.addEventListener('dragstart', e => { dragK = k; li.classList.add('drag'); try { e.dataTransfer.setData('text/plain', String(k)); } catch (_) {} });
            li.addEventListener('dragend', () => li.classList.remove('drag'));
            li.addEventListener('dragover', e => { e.preventDefault(); li.classList.add('over'); });
            li.addEventListener('dragleave', () => li.classList.remove('over'));
            li.addEventListener('drop', e => { e.preventDefault(); if (dragK === null || solved) return; const [it] = items.splice(dragK, 1); items.splice(k, 0, it); dragK = null; draw(); });
            return li;
          }));
        };
        chk.addEventListener('click', () => {
          if (solved) return; tries++;
          const wrongAt = items.findIndex((t, k) => t !== correct[k]);
          if (wrongAt < 0) { solved = true; chk.disabled = true; setFb(fb, 'ok', 'Urutan tepat. Titik potong memberi batas; arah irisan menentukan fungsi pembatas; baru kemudian integral dibentuk dan dihitung.'); draw(); done(tries === 1); }
          else setFb(fb, 'bad', `Posisi ${wrongAt + 1} belum tepat. Ingat: batas integrasi berasal dari titik potong, dan fungsi pembatas bergantung pada arah irisan.`);
        });
        draw();
      }
      left.append(E('div', { class: 'row' }, nextBtn));
      typeset(box);
    };
    const renderSum = () => {
      box.replaceChildren();
      const wrap = E('div', { class: 'grid even' }); box.append(wrap);
      const left = E('div', { class: 'panel' }), right = E('div', { class: 'panel' }); wrap.append(left, right);
      left.append(H(`<ol class="flow"><li class="on">Grafik</li><li class="on">Titik potong</li><li class="on">Batas</li><li class="on">Irisan</li><li class="on">Integral</li><li class="on">Luas</li></ol>`));
      left.append(H(`<div class="plate big"><span class="lbl">Irisan vertikal</span>${dm`A=\int_a^b\big[f(x)-g(x)\big]\,dx`}<p class="small muted">${m`f`} kurva atas, ${m`g`} kurva bawah, ${m`a,b`} nilai x.</p></div>`));
      left.append(H(`<div class="plate big"><span class="lbl">Irisan horizontal</span>${dm`A=\int_c^d\big[f(y)-g(y)\big]\,dy`}<p class="small muted">${m`f(y)=x_R`} kurva kanan, ${m`g(y)=x_L`} kurva kiri, ${m`c,d`} nilai y.</p></div>`));
      left.append(H(`<div class="plate"><span class="lbl">Luas terhadap sumbu-x</span>${dm`L=\int_a^b|f(x)|\,dx`}</div>`));
      right.append(H(`<div class="q-tag" style="margin-bottom:6px">Hasil contoh dalam modul</div><div class="tablewrap"><table class="sumtab">
        <tr><th>Daerah</th><th>Irisan</th><th>Luas</th></tr>
        <tr><td>${m`y=x^2-1`}, ${m`x=\pm2`}, sumbu-x</td><td>dx, 3 subregion</td><td>${m`4`}</td></tr>
        <tr><td>${m`y=x`}, ${m`y=x^2`}</td><td>dx</td><td>${m`\tfrac16`}</td></tr>
        <tr><td>${m`y=x^2`}, ${m`y=-x+2`}, sumbu x</td><td>dx (2 subregion) atau dy</td><td>${m`\tfrac56`}</td></tr>
        <tr><td>${m`y=x-1`}, ${m`y^2=2x+6`}</td><td>dy</td><td>${m`18`}</td></tr>
        <tr><td>${m`y=x^2`}, ${m`y=2x-x^2`}</td><td>dx</td><td>${m`\tfrac13`}</td></tr></table></div>`));
      const tid = uid('refl');
      const refl = E('div', { class: 'q' },
        E('div', { class: 'q-tag' }, 'Refleksi'),
        E('label', { class: 'q-text', for: tid }, 'Jika diberikan dua kurva, bagaimana Anda menentukan integral yang tepat untuk menghitung luas daerah di antaranya?'),
        E('textarea', { id: tid, placeholder: 'Tulis jawaban Anda di sini. Catatan ini hanya tersimpan selama halaman terbuka.' }));
      const ex = E('div', { class: 'hint', hidden: true, html: '<strong>Contoh jawaban.</strong> Gambar grafik dan arsir daerahnya. Cari titik potong kedua kurva. Periksa arah irisan: jika irisan vertikal selalu punya kurva atas dan bawah yang sama, pakai dx dengan batas nilai x; jika irisan horizontal selalu punya kurva kiri dan kanan yang sama, pakai dy dengan batas nilai y dan ubah persamaan ke bentuk x = f(y). Jika tidak ada yang tetap, bagi daerah menjadi subregion. Integralnya adalah (atas − bawah)dx atau (kanan − kiri)dy, dan hasilnya harus positif.' });
      refl.append(E('div', { class: 'q-tools' }, E('button', { class: 'btn sm', type: 'button', onclick: () => ex.hidden = false }, 'LIHAT CONTOH JAWABAN')), ex);
      right.append(refl);
      typeset(box);
    };
    const tabSeg = seg(tabs, ['Quiz (10 soal)', 'Rangkuman'], i => i ? renderSum() : renderQuiz(), 0, 'Quiz atau rangkuman');
  }
});

/* =========================================================
   APP: navigation, menu, progress
   ========================================================= */
const App = {
  i: 0, visited: new Set(), doneS: new Set(),
  init() {
    $('#btnPrev').addEventListener('click', () => this.prev());
    $('#btnNext').addEventListener('click', () => this.next());
    $('#btnReset').addEventListener('click', () => this.render());
    $('#btnMenu').addEventListener('click', () => this.menu(true));
    $('#btnMenuClose').addEventListener('click', () => this.menu(false));
    $('#menu').addEventListener('click', e => { if (e.target.id === 'menu') this.menu(false); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { this.menu(false); return; }
      const t = e.target; if (t && (t.matches('input,select,textarea') || t.isContentEditable)) return;
      if (!$('#menu').hidden) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); this.next(); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); this.prev(); }
    });
    let start = 0; const mm = (location.hash || '').match(/^#s(\d{1,2})$/); if (mm) start = clamp(+mm[1] - 1, 0, SL.length - 1);
    this.go(start);
  },
  go(i) { this.i = clamp(i, 0, SL.length - 1); this.visited.add(this.i); this.menu(false); this.render(); },
  next() { if (this.i < SL.length - 1) this.go(this.i + 1); },
  prev() { if (this.i > 0) this.go(this.i - 1); },
  render() {
    const s = SL[this.i], main = $('#main');
    main.replaceChildren();
    const root = E('section', { class: 'slide', 'aria-label': s.title }); main.append(root);
    try { s.build(root); } catch (e) { console.error(e); root.append(E('p', { class: 'fb bad' }, 'Slide ini gagal dimuat: ' + e.message)); }
    typeset(root); main.scrollTop = 0;
    const nn = String(this.i + 1).padStart(2, '0'), tot = String(SL.length).padStart(2, '0');
    $('#cnt').textContent = `SLIDE ${nn} / ${tot}`; $('#cntSec').textContent = s.sec;
    $('#prog').style.width = ((this.i + 1) / SL.length * 100) + '%';
    $('#btnPrev').disabled = this.i === 0; $('#btnNext').disabled = this.i === SL.length - 1;
    $('#hdrTitle').textContent = s.title;
    try { history.replaceState(null, '', '#s' + nn); } catch (e) {}
    this.renderMenu();
  },
  done() { this.doneS.add(this.i); this.renderMenu(); },
  renderMenu() {
    const body = $('#menuBody'); body.replaceChildren(); let sec = null, list = null;
    SL.forEach((s, k) => {
      if (s.sec !== sec) { sec = s.sec; body.append(E('div', { class: 'menu-sec' }, sec)); list = E('ul', { class: 'menu-list' }); body.append(list); }
      const st = this.doneS.has(k) ? '✓' : this.visited.has(k) ? '•' : '';
      list.append(E('li', {}, E('button', { type: 'button', class: k === this.i ? 'cur' : null, 'aria-current': k === this.i ? 'page' : null, onclick: () => this.go(k) },
        E('span', { class: 'no' }, String(k + 1).padStart(2, '0')), E('span', {}, s.title), E('span', { class: 'st' + (this.doneS.has(k) ? '' : ' v') }, st))));
    });
  },
  menu(open) { const m = $('#menu'); m.hidden = !open; if (open) { const c = m.querySelector('.cur'); c && c.focus(); } }
};
App.init();
</script>
